#!/usr/bin/env python3
"""
Minimal Telegram sendMessage helper for text, Markdown, and inline keyboards.
"""

import os
from typing import Any
import requests


def get_telegram_config() -> tuple[str, str]:
    token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
    chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
    if not token or not chat_id:
        raise RuntimeError("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID in environment.")
    return token, chat_id


def send_telegram_message(
    text: str,
    inline_keyboard: list[list[dict[str, Any]]] | None = None,
    parse_mode: str = "Markdown",
    chat_id: str | None = None,
    bot_token: str | None = None,
    timeout: int = 10,
) -> dict[str, Any]:
    env_token, env_chat_id = get_telegram_config()
    token = (bot_token or env_token).strip()
    target_chat = (chat_id or env_chat_id).strip()

    payload: dict[str, Any] = {
        "chat_id": target_chat,
        "text": text,
        "disable_web_page_preview": True,
    }
    if parse_mode:
        payload["parse_mode"] = parse_mode
    if inline_keyboard:
        payload["reply_markup"] = {"inline_keyboard": inline_keyboard}

    url = f"https://api.telegram.org/bot{token}/sendMessage"
    resp = requests.post(url, json=payload, timeout=timeout)
    resp.raise_for_status()
    data = resp.json()
    if not data.get("ok"):
        raise RuntimeError(f"Telegram sendMessage failed: {data}")
    return data


if __name__ == "__main__":
    # Plain / Markdown status message
    res = send_telegram_message("✅ *Telegram Config Check:* Scanner alert channel is active.")
    print("Sent message_id:", res["result"]["message_id"])
